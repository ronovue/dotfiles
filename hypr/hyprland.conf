# ── Monitor & Variables ─────────────────────────
monitor = eDP-1,preferred,auto,1

$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = firefox

$mainMod = SUPER

# ── Environment ───────────────────────────────
env = HYPRCURSOR_THEME,Breeze
env = XCURSOR_SIZE,25
env = HYPRCURSOR_SIZE,25
env = XCURSOR_THEME,Breeze

# ── Startup Applications ───────────────────────
exec-once = nm-applet & blueman-applet
exec-once = firefox
#exec-once = flatpak run com.spotify.Client
exec-once = thunar
exec-once = hyprpaper & swaync & hypridle
exec-once = hyprctl setcursor Breeze 25
exec-once = systemctl --user start hyprpolkitagent
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND
exec-once = kitty
# ── General Settings ──────────────────────────
general {
    gaps_in = 0
    gaps_out = 1
    border_size = 2
    col.active_border = rgba(180,40,60,1) rgba(80,30,110,1) 45deg
    col.inactive_border = rgba(120,120,120,0.3)
    #col.active_border = rgba(255,255,255,1) rgba(255,255,255,0.6) 45deg
    #col.inactive_border = rgba(0d1f2f88)
    resize_on_border = true
    allow_tearing = false
    layout = master
}

# ── Decorations ──────────────────────────────
decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.17
    }
}
decoration {
    shadow {
        enabled = true
        color = rgba(120,40,120,0.4)
        range = 6
    }
}
# ── Animations ───────────────────────────────
animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
#   animation = windows, 1, 4.79, easeOutQuint
#   animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
#   animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = windows, 1, 6, overshot
    animation = windowsIn, 1, 6, overshot, slide bottom
    animation = windowsOut, 1, 5, overshot, slide top
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 2, almostLinear, slide
    animation = workspacesIn, 1, 2, almostLinear, slide
    animation = workspacesOut, 1, 2, almostLinear, slide
}

# ── Layouts ──────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_on_top = true
    new_status = master
    orientation = left
    }

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

# ── Input ────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ── Keybindings ──────────────────────────────
bind = $mainMod, Q, killactive,
bind = $mainMod, X, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = , PRINT, exec, hyprshot -m window
bind = SHIFT, PRINT, exec, hyprshot -m region
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, F, exec, $browser
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, W, exec, sh -c 'pgrep waybar && pkill waybar || waybar'  # toggle Waybar
bind = SUPER, I, exec, ~/.config/hypr/scripts/toggle-idle.sh

bind = $mainMod, N, exec, sh -c 'pgrep gammastep && pkill gammastep || gammastep -O 3500'

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Audio & Brightness Keys ───────────────────
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# ── Player Controls ──────────────────────────
bind = SHIFT, right, exec, playerctl next
bind = SHIFT, left, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# ── Window Rules ─────────────────────────────
windowrule {
  name = suppress-maximize
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = nofocus-ghost
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}
# ── Workspace-specific Rules ──────────────────
#windowrulev2 = workspace 4 silent, class:thunar
windowrule {
  name = thunar
  workspace = 3 silent
  match:class = thunar
}
#windowrulev2 = workspace 2 silent, class:firefox
windowrule {
  name = firefox
  workspace = 2 silent
  match:class = firefox
}

#bind = $mainMod, T, exec, hyprctl keyword general:layout master
#bind = $mainMod, Y, exec, hyprctl keyword general:layout scrolling
