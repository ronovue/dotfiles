# ── Colors ──────────────────────────────────────
source = ~/.config/hypr/hyprlock/colors.conf

# ── Background ──────────────────────────────────
background {
    color = rgba(5, 10, 18, 1.0)

    blur_passes = 0
    blur_size = 0
    noise = 0.02
}

# ── Input Field ────────────────────────────────
input-field {
    size = 280, 55
    outline_thickness = 2

    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(00C8DC99)          # teal glow border
    inner_color = rgba(10, 20, 35, 0.75) # dark blue glass bg
    font_color = rgba(C8F9FFFF)           # icy text

    fade_on_empty = true
    placeholder_text = <span foreground="#5FAFD7">Password...</span>

    position = 0, 20
    halign = center
    valign = center
}

# ── Layout Indicator ───────────────────────────
label {
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

# ── Caps Lock Warning ──────────────────────────
label {
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -25
    halign = center
    valign = center
}

# ── Clock ─────────────────────────────────────
label {
    text = $TIME
    color = rgba(E6FCFFFF)
    font_size = 65
    font_family = $font_family_clock
    position = 0, 300
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────
label {
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(9FDFFFDD)
    font_size = 17
    font_family = $font_family_clock
    position = 0, 240
    halign = center
    valign = center
}

# ── User Info ─────────────────────────────────
label {
    text =   $USER
    color = rgba(C8F9FFFF)

    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    font_size = 20
    font_family = $font_family

    position = 0, 50
    halign = center
    valign = bottom
}

# ── Status ────────────────────────────────────
label {
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = rgba(7FCFEEDD)
    font_size = 14
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}
