# ── Colors ──────────────────────────────────────
source = ~/.config/hypr/hyprlock/colors.conf

# ── Background ──────────────────────────────────
background {
color = rgba(5, 2, 10, 1.0)    blur_passes = 0
    blur_size = 0
    noise = 0.02
}
# ── Input Field ────────────────────────────────
input-field {
    size = 280, 55
    outline_thickness = 2

    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(B4283C99)     # crimson border glow
    inner_color = rgba(20, 8, 30, 0.75)  # dark purple glass background
    font_color = rgba(D8B4FFFF)      # soft purple input text

    fade_on_empty = true
    placeholder_text = <span foreground="#6E2B8F">Password...</span>

    position = 0, 20
    halign = center
    valign = center
}
# ── Layout Indicator ───────────────────────────
label {
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

# ── Caps Lock Warning ──────────────────────────
label {
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -25
    halign = center
    valign = center
}

# ── Clock ─────────────────────────────────────
label {
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock
    position = 0, 300
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────
label {
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family_clock
    position = 0, 240
    halign = center
    valign = center
}

# ── User Info ─────────────────────────────────
label {
    text =   $USER
    color = $text_color
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 20
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

# ── Status ────────────────────────────────────
label {
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}

