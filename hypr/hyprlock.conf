source = ~/.config/hypr/hyprlock/colors.conf

background {
    color = rgba(5, 10, 18, 1.0)
    blur_passes = 0
    blur_size = 0
    noise = 0.02
}

input-field {
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(00C8DC99)
    inner_color = rgba(10, 20, 35, 0.75)
    font_color = rgba(C8F9FFFF)
    fade_on_empty = true
    position = 0, 20
    halign = center
    valign = center
}

label {
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

label {
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    position = 0, -25
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(E6FCFFFF)
    font_size = 65
    font_family = $font_family_clock
    position = 0, 300
    halign = center
    valign = center
}

label {
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(9FDFFFDD)
    font_size = 17
    font_family = $font_family_clock
    position = 0, 240
    halign = center
    valign = center
}

label {
    text =   $USER
    color = rgba(C8F9FFFF)
    font_size = 20
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = rgba(7FCFEEDD)
    font_size = 14
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}
